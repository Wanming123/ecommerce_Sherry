server:
  port: 8090

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ecomm
              uri: lb://ecomm
              predicates:
                - Path=/api/v1/carts/**,/api/v1/cartItems/**,/api/v1/products/**,/api/v1/categories/**,/api/v1/images/**
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**,/api/v1/auth/**
            - id: order-service
              uri: lb://order-service
              predicates:
                - Path=/api/v1/orders/**
          default-filters:
            - AddResponseHeader=X-Response-Source, api-gateway

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
